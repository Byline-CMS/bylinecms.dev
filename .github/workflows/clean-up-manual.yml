name: Clean up (manual)

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Delete workflow runs older than this many days.'
        required: true
        type: number
        default: 14
      dry_run:
        description: 'Only log what would be deleted. Untick to actually delete.'
        required: false
        type: boolean
        default: true

jobs:
  del_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: ${{ inputs.days }}
          keep_minimum_runs: 6
          dry_run: ${{ inputs.dry_run }}
