name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

# Run one job per ref; cancel earlier in-flight runs on the same ref to
# save minutes when a contributor pushes a quick fix-up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    # Skip release commits (`chore(release): 1.2.3`) — they only bump versions
    # and CHANGELOG entries; the underlying code has already been gated by an
    # earlier run. PRs evaluate the head_commit context as empty, so this
    # condition only filters direct pushes to develop/main.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm byline:generate:check
      - run: pnpm docs:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Dead-code guard: fails on unused production dependencies; unused
      # files and devDependencies surface as warnings only (see knip.json).
      - run: pnpm knip

  test-suite:
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: byline
          POSTGRES_PASSWORD: byline
          POSTGRES_DB: byline_test
        ports:
          - 5432:5432
        # Wait for Postgres to be ready before the workflow steps run.
        options: >-
          --health-cmd "pg_isready -U byline -d byline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Pinned to 8.0 deliberately: the adapter's engine floor is MySQL
      # 8.0.14 (the release that added LATERAL joins and lifted the
      # no-subquery-in-a-view's-FROM restriction, both of which the storage
      # layer relies on). Local development runs `mysql:latest` (9.x) via
      # `mysql/docker-compose.yml`, so pinning 8.0 here is what actually
      # exercises the floor rather than a version comfortably above it.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: byline_test
          MYSQL_USER: byline
          MYSQL_PASSWORD: byline
        ports:
          - 3306:3306
        # `mysqladmin ping` with explicit root credentials: an unauthenticated
        # ping can report success while the server is still initialising the
        # data directory, which would let the migration step race startup.
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptest --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      BYLINE_DB_POSTGRES_CONNECTION_STRING: postgres://byline:byline@127.0.0.1:5432/byline_test
      BYLINE_DB_MYSQL_CONNECTION_STRING: mysql://byline:byline@127.0.0.1:3306/byline_test

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # @byline/db-postgres exposes the test-db helper under the `./testing`
      # subpath; @byline/client imports it from its built `dist/`. Building
      # all packages ensures every import path resolves.
      - run: pnpm build:packages

      # Every integration runner reads its connection string from a `.env.test`
      # file. CI writes them from the job-level env block; they're gitignored so
      # committing them by accident isn't possible. Each adapter's
      # `assertTestDatabase` also refuses any database whose name doesn't end in
      # `_test`, so a misconfigured string fails loudly rather than pointing at
      # something it shouldn't.
      - name: Write .env.test files
        run: |
          cat > packages/db-postgres/.env.test <<EOF
          BYLINE_DB_POSTGRES_CONNECTION_STRING=$BYLINE_DB_POSTGRES_CONNECTION_STRING
          EOF
          cat > packages/client/.env.test <<EOF
          BYLINE_DB_POSTGRES_CONNECTION_STRING=$BYLINE_DB_POSTGRES_CONNECTION_STRING
          EOF
          cat > packages/search-postgres/.env.test <<EOF
          BYLINE_DB_POSTGRES_CONNECTION_STRING=$BYLINE_DB_POSTGRES_CONNECTION_STRING
          EOF
          cat > packages/db-mysql/.env.test <<EOF
          BYLINE_DB_MYSQL_CONNECTION_STRING=$BYLINE_DB_MYSQL_CONNECTION_STRING
          EOF
          cat > packages/search-mysql/.env.test <<EOF
          BYLINE_DB_MYSQL_CONNECTION_STRING=$BYLINE_DB_MYSQL_CONNECTION_STRING
          EOF

      # Unit suites across every package (core/auth/admin/ai/host/client/...).
      # Pure CPU, no DB
      - run: pnpm test
      # Integration tests now - require byline_test DB
      - run: pnpm test:integration

      # Temporal regression guard. Both adapters anchor `date` values to UTC
      # midnight deliberately, so the same stored value names the same calendar
      # day regardless of which host serves it. The runner defaults to TZ=UTC,
      # where local and UTC midnight are the same instant — so an adapter that
      # silently reverted to a host-local anchor passes every step above.
      #
      # Verified non-vacuous: replacing normalize-row's `T00:00:00.000Z` with a
      # local `T00:00:00.000` keeps all 177 Postgres tests green under TZ=UTC
      # and fails "02 Field Types > round-trips a calendar date at UTC midnight"
      # under the offset below.
      #
      # Only the two adapter suites re-run, and only inside this job — the
      # services and the build are already warm, so the added cost is the
      # suites themselves rather than another install/build/service cycle.
      # Kathmandu (UTC+5:45) is chosen over a whole-hour offset because it also
      # catches arithmetic that assumes offsets are whole hours. The shared
      # `@byline/db-conformance` field-types suite carries the temporal
      # coverage, so both adapters are exercised by this one step.
      - name: Adapter conformance under a non-UTC timezone
        env:
          TZ: Asia/Kathmandu
        run: pnpm --filter @byline/db-postgres --filter @byline/db-mysql test:integration
