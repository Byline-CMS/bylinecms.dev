packages:
  - "packages/*"
  - "apps/*"
  - "benchmarks/storage"
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - "@infonomic/*"
  - "@byline/*"
allowBuilds:
  "@google/genai": true
  "@parcel/watcher": true
  esbuild: true
  lightningcss-cli: true
  protobufjs: true
  sharp: true
  simple-git-hooks: true
  "@tailwindcss/oxide": true
  argon2: true
  core-js: true
allowedDeprecatedVersions:
  abab: "2"
  domexception: "4"
# keyv 6 removed get(key, { raw: true }), which cache-manager@7 and cacheable@2
# still call. Remove this hold once both declare keyv ^6 — the tripwire is
# apps/webapp/src/lib/cache/keyv-compat.test.node.ts.
updateConfig:
  ignoreDependencies:
    - keyv
